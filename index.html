<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Особенности русской литературы начала XX века — Сеит-Велиев Демирель (11-А)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg: #09090e;
  --bg-secondary: #101018;
  --card-bg: rgba(20, 20, 30, 0.7);
  --gold: #d4af37;
  --gold-bright: #f3e5ab;
  --gold-dark: #8c7322;
  --accent: #8b5cf6;
  --accent-light: #c4b5fd;
  --text: #f1f0ea;
  --text-muted: #a3a19d;
  --border-gold: rgba(212, 175, 55, 0.28);
  --border-subtle: rgba(255, 255, 255, 0.08);
  --shadow-glow: 0 10px 40px -10px rgba(212, 175, 55, 0.2);
}

body.theme-light {
  --bg: #f8f6f0;
  --bg-secondary: #eee9dc;
  --card-bg: rgba(255, 255, 255, 0.85);
  --gold: #966f1b;
  --gold-bright: #684a08;
  --gold-dark: #4b3506;
  --accent: #5b21b6;
  --accent-light: #7c3aed;
  --text: #1f1d1a;
  --text-muted: #57534e;
  --border-gold: rgba(150, 111, 27, 0.35);
  --border-subtle: rgba(0, 0, 0, 0.08);
  --shadow-glow: 0 10px 30px -10px rgba(150, 111, 27, 0.15);
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  height: 100vh;
  width: 100vw;
  user-select: none;
  transition: background 0.4s ease, color 0.4s ease;
}

/* Background atmospheric noise and gradients */
#ambient-glow {
  position: fixed;
  inset: 0;
  background: 
    radial-gradient(circle at 15% 20%, rgba(139, 92, 246, 0.12), transparent 45%),
    radial-gradient(circle at 85% 75%, rgba(212, 175, 55, 0.10), transparent 50%),
    radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 0.5), transparent 70%);
  pointer-events: none;
  z-index: 0;
}

/* Top Progress bar */
#progress-bar {
  position: fixed;
  top: 0;
  left: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--accent), var(--gold), var(--gold-bright));
  z-index: 150;
  transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 0 12px var(--gold);
}

/* Top Navigation & Info Header */
#top-header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 52px;
  background: rgba(9, 9, 14, 0.75);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 28px;
  border-bottom: 1px solid var(--border-gold);
  z-index: 100;
}

.header-meta {
  display: flex;
  align-items: center;
  gap: 14px;
}

.pill-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  padding: 4px 10px;
  border-radius: 20px;
  background: rgba(212, 175, 55, 0.12);
  color: var(--gold);
  border: 1px solid var(--border-gold);
}

.author-info {
  font-size: 13px;
  color: var(--text-muted);
  font-weight: 500;
}
.author-info strong {
  color: var(--text);
  font-weight: 600;
}

.header-controls {
  display: flex;
  align-items: center;
  gap: 10px;
}

.action-btn {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border-subtle);
  color: var(--text);
  padding: 6px 14px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s ease;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.action-btn:hover {
  background: rgba(212, 175, 55, 0.18);
  border-color: var(--gold);
  color: var(--gold-bright);
}

/* Slide viewport */
#app {
  width: 100vw;
  height: 100vh;
  position: relative;
  z-index: 10;
}

.slide {
  display: none;
  width: 100%;
  height: 100%;
  position: absolute;
  top: 0;
  left: 0;
  padding-top: 52px;
  padding-bottom: 60px;
  opacity: 0;
  transform: scale(0.985);
  transition: opacity 0.35s ease, transform 0.35s ease;
}

.slide.active {
  display: flex;
  opacity: 1;
  transform: scale(1);
}

.slide-grid {
  display: grid;
  grid-template-columns: 1.15fr 0.85fr;
  width: 100%;
  height: 100%;
  max-width: 1680px;
  margin: 0 auto;
  padding: 30px 48px;
  gap: 40px;
  align-items: center;
}

/* Left column: Rich Informative Text */
.slide-text-col {
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding-right: 20px;
  overflow-y: auto;
}

.slide-text-col::-webkit-scrollbar {
  width: 5px;
}
.slide-text-col::-webkit-scrollbar-thumb {
  background: var(--gold-dark);
  border-radius: 4px;
}

.section-indicator {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 2.5px;
  color: var(--gold);
  margin-bottom: 14px;
}
.section-indicator::before {
  content: "";
  display: inline-block;
  width: 16px;
  height: 2px;
  background: var(--gold);
}

.slide-heading {
  font-family: 'Cinzel', 'Playfair Display', serif;
  font-size: clamp(26px, 2.6vw, 40px);
  font-weight: 700;
  line-height: 1.25;
  margin-bottom: 22px;
  background: linear-gradient(135deg, #ffffff 10%, var(--gold-bright) 65%, var(--gold) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 2px 10px rgba(212, 175, 55, 0.2));
}

body.theme-light .slide-heading {
  background: linear-gradient(135deg, #2b1d0c 20%, var(--gold) 85%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.slide-body {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: clamp(17px, 1.35vw, 21px);
  line-height: 1.68;
  color: var(--text);
  user-select: text;
}

.slide-body p {
  margin-bottom: 14px;
}
.slide-body strong {
  color: var(--gold-bright);
  font-weight: 700;
}
body.theme-light .slide-body strong {
  color: var(--gold-dark);
}
.slide-body em {
  color: var(--accent-light);
  font-style: italic;
}
body.theme-light .slide-body em {
  color: var(--accent);
}
.slide-body ul {
  padding-left: 24px;
  margin: 12px 0;
}
.slide-body li {
  margin-bottom: 8px;
  position: relative;
}
.slide-body li::marker {
  color: var(--gold);
}

.key-point-box {
  margin-top: 18px;
  padding: 12px 18px;
  border-radius: 8px;
  background: rgba(212, 175, 55, 0.08);
  border-left: 3px solid var(--gold);
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  color: var(--gold-bright);
  line-height: 1.5;
  display: flex;
  align-items: center;
  gap: 10px;
}
body.theme-light .key-point-box {
  background: rgba(150, 111, 27, 0.08);
  color: var(--gold-dark);
}

/* Right column: Visual Art Card */
.slide-visual-col {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.art-card {
  width: 100%;
  max-width: 500px;
  height: 560px;
  border-radius: 18px;
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 24px;
  box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), var(--shadow-glow);
  backdrop-filter: blur(16px);
  overflow: hidden;
  transition: transform 0.3s ease;
}
.art-card:hover {
  transform: translateY(-4px);
}

/* Decorative corner filigree */
.art-corner-decor {
  position: absolute;
  width: 18px;
  height: 18px;
  border-style: solid;
  border-width: 0;
  pointer-events: none;
  opacity: 0.6;
}
.art-corner-decor.tl { top: 10px; left: 10px; border-top-width: 2px; border-left-width: 2px; }
.art-corner-decor.tr { top: 10px; right: 10px; border-top-width: 2px; border-right-width: 2px; }
.art-corner-decor.bl { bottom: 10px; left: 10px; border-bottom-width: 2px; border-left-width: 2px; }
.art-corner-decor.br { bottom: 10px; right: 10px; border-bottom-width: 2px; border-right-width: 2px; }

.art-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 2;
}
.art-badge {
  font-size: 10.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  padding: 5px 12px;
  border-radius: 20px;
}
.art-slide-num {
  font-family: 'Cinzel', serif;
  font-size: 13px;
  color: var(--gold);
  font-weight: 700;
  letter-spacing: 1px;
}

.art-canvas-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px 0;
  position: relative;
}
.art-svg {
  width: 100%;
  max-width: 260px;
  max-height: 260px;
  filter: drop-shadow(0 10px 25px rgba(0,0,0,0.4));
  animation: floatSvg 6s ease-in-out infinite alternate;
}
@keyframes floatSvg {
  0% { transform: translateY(0); }
  100% { transform: translateY(-8px); }
}

.art-footer {
  z-index: 2;
}
.art-quote {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-style: italic;
  font-size: 15px;
  line-height: 1.5;
  color: var(--text);
  padding-left: 14px;
  border-left: 2px solid var(--gold);
  margin-bottom: 8px;
}
.art-caption {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--text-muted);
  font-weight: 600;
}

/* Bottom Navigation Bar */
#nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 60px;
  background: rgba(9, 9, 14, 0.85);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px;
  border-top: 1px solid var(--border-gold);
  z-index: 100;
}

.nav-cluster {
  display: flex;
  align-items: center;
  gap: 12px;
}

.nav-btn {
  background: rgba(212, 175, 55, 0.1);
  border: 1px solid var(--border-gold);
  color: var(--gold-bright);
  padding: 8px 20px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.5px;
  transition: all 0.2s ease;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.nav-btn:hover {
  background: var(--gold);
  color: #09090e;
  box-shadow: 0 0 16px rgba(212, 175, 55, 0.4);
}

.counter-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
}
#counter {
  font-family: 'Cinzel', serif;
  color: var(--gold);
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 1px;
}
#jump-input {
  width: 48px;
  padding: 4px 6px;
  text-align: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid var(--border-subtle);
  border-radius: 6px;
  color: var(--text);
  font-size: 12px;
  outline: none;
}
#jump-input:focus {
  border-color: var(--gold);
}

/* Modal Table of Contents */
#toc-modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(9, 9, 14, 0.94);
  backdrop-filter: blur(20px);
  z-index: 200;
  overflow-y: auto;
  padding: 40px 60px;
}
#toc-modal.open {
  display: block;
}
.toc-container {
  max-width: 1280px;
  margin: 0 auto;
}
.toc-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 30px;
  border-bottom: 1px solid var(--border-gold);
  padding-bottom: 20px;
}
.toc-top h2 {
  font-family: 'Cinzel', serif;
  font-size: 28px;
  color: var(--gold);
}
.toc-search {
  padding: 8px 16px;
  width: 320px;
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.07);
  border: 1px solid var(--border-gold);
  color: #fff;
  font-size: 14px;
  outline: none;
}
.toc-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
  gap: 12px;
}
.toc-item {
  padding: 12px 16px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--border-subtle);
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  align-items: baseline;
  gap: 10px;
}
.toc-item:hover {
  background: rgba(212, 175, 55, 0.12);
  border-color: var(--gold);
  transform: translateX(4px);
}
.toc-num {
  font-family: 'Cinzel', serif;
  color: var(--gold);
  font-weight: 700;
  font-size: 13px;
  min-width: 28px;
}
.toc-title {
  font-size: 13.5px;
  color: var(--text);
  line-height: 1.4;
}

/* Print Mode for PDF export */
@media print {
  body {
    overflow: visible !important;
    background: #fff !important;
    color: #111 !important;
  }
  #top-header, #nav, #toc-modal, #progress-bar, #ambient-glow {
    display: none !important;
  }
  #app {
    height: auto !important;
    position: static !important;
  }
  .slide {
    display: flex !important;
    position: relative !important;
    page-break-after: always !important;
    break-after: page !important;
    height: 100vh !important;
    opacity: 1 !important;
    transform: none !important;
    padding: 30px !important;
  }
  .slide-grid {
    padding: 0 !important;
  }
  .slide-heading {
    -webkit-text-fill-color: #8c7322 !important;
    color: #8c7322 !important;
  }
  .slide-body {
    color: #222 !important;
  }
  .art-card {
    border: 1px solid #ccc !important;
    background: #fdfdfd !important;
    box-shadow: none !important;
  }
}

/* Real Photo Card Styling */
.photo-card {
  width: 100%;
  max-width: 520px;
  height: 580px;
  border-radius: 18px;
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 20px;
  background: var(--card-bg);
  border: 1px solid var(--border-gold);
  box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), var(--shadow-glow);
  backdrop-filter: blur(16px);
  cursor: pointer;
  transition: transform 0.3s ease, border-color 0.3s ease;
}
.photo-card:hover {
  transform: translateY(-4px);
  border-color: var(--gold);
}
.photo-frame {
  flex: 1;
  width: 100%;
  border-radius: 12px;
  overflow: hidden;
  position: relative;
  background: #050508;
  display: flex;
  align-items: center;
  justify-content: center;
}
.slide-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center top;
  transition: transform 0.5s ease;
}
.photo-card:hover .slide-img {
  transform: scale(1.03);
}
.photo-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.25s ease;
}
.photo-card:hover .photo-overlay {
  opacity: 1;
}
.zoom-badge {
  background: rgba(9, 9, 14, 0.85);
  color: var(--gold-bright);
  border: 1px solid var(--gold);
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  backdrop-filter: blur(8px);
}
.photo-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 14px;
}
.photo-badge {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  padding: 4px 12px;
  border-radius: 20px;
  background: rgba(212, 175, 55, 0.15);
  color: var(--gold);
  border: 1px solid var(--border-gold);
}
.photo-slide-num {
  font-family: 'Cinzel', serif;
  font-size: 12.5px;
  color: var(--text-muted);
  font-weight: 600;
}
.photo-caption {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-style: italic;
  font-size: 15px;
  line-height: 1.45;
  color: var(--text);
  margin-top: 8px;
  padding-left: 10px;
  border-left: 2px solid var(--gold);
}

/* Lightbox Modal */
#lightbox-modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(5, 5, 8, 0.95);
  backdrop-filter: blur(20px);
  z-index: 300;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  padding: 40px;
}
#lightbox-modal.open {
  display: flex;
}
#lightbox-img {
  max-width: 90vw;
  max-height: 80vh;
  object-fit: contain;
  border-radius: 12px;
  border: 1px solid var(--border-gold);
  box-shadow: 0 0 50px rgba(0,0,0,0.8);
}
#lightbox-caption {
  margin-top: 20px;
  font-family: 'Cormorant Garamond', serif;
  font-size: 20px;
  font-style: italic;
  color: var(--gold-bright);
  text-align: center;
  max-width: 800px;
}
.lightbox-close {
  position: absolute;
  top: 25px;
  right: 35px;
  background: rgba(212, 175, 55, 0.2);
  border: 1px solid var(--gold);
  color: #fff;
  padding: 8px 18px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
}


/* ===================================================
   MOBILE & TABLET ADAPTATION
   =================================================== */

@media screen and (max-width: 960px) {
  body {
    overflow: auto;
  }
  #app {
    height: 100dvh;
    min-height: 100vh;
  }
  .slide {
    display: none;
    position: absolute;
    inset: 0;
    padding-top: 56px;
    padding-bottom: 66px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    height: 100%;
  }
  .slide.active {
    display: block;
  }
  .slide-grid {
    display: flex;
    flex-direction: column;
    padding: 20px 24px 30px;
    gap: 22px;
    height: auto;
    min-height: 100%;
    align-items: stretch;
  }
  .slide-text-col {
    height: auto;
    padding-right: 0;
    overflow-y: visible;
  }
  .slide-heading {
    font-size: clamp(22px, 5vw, 30px);
    margin-bottom: 16px;
  }
  .slide-body {
    font-size: 17px;
    line-height: 1.62;
  }
  .slide-visual-col {
    height: auto;
    width: 100%;
    justify-content: center;
    margin-top: 6px;
  }
  .photo-card {
    max-width: 100%;
    height: 380px;
    padding: 14px;
    border-radius: 16px;
  }
  .photo-frame {
    height: 270px;
    max-height: 270px;
  }
  .photo-caption {
    font-size: 13.5px;
  }
  .key-point-box {
    margin-top: 14px;
    font-size: 13px;
  }
  #top-header {
    padding: 0 16px;
    height: 50px;
  }
  .pill-tag {
    font-size: 10px;
    padding: 3px 8px;
    letter-spacing: 1px;
  }
  .author-info {
    font-size: 12px;
  }
  #nav {
    padding: 0 16px;
    height: 58px;
  }
  .nav-btn {
    padding: 8px 16px;
    font-size: 13px;
  }
  .nav-cluster:last-child {
    display: none; /* Hide keyboard shortcut hints on mobile */
  }
  #toc-modal {
    padding: 24px 20px;
  }
  .toc-top {
    flex-direction: column;
    align-items: stretch;
    gap: 14px;
  }
  .toc-top h2 {
    font-size: 22px;
  }
  .toc-search {
    width: 100%;
  }
  .toc-grid {
    grid-template-columns: 1fr;
    gap: 8px;
  }
}

@media screen and (max-width: 600px) {
  #top-header {
    height: 46px;
    padding: 0 10px;
  }
  .author-info {
    display: none; /* Keep header clean on small phones */
  }
  .action-btn:nth-child(3),
  .action-btn:nth-child(4) {
    display: none; /* Hide print & fullscreen on small screens */
  }
  .action-btn {
    padding: 5px 9px;
    font-size: 11px;
  }
  .slide {
    padding-top: 48px;
    padding-bottom: 60px;
  }
  .slide-grid {
    padding: 14px 14px 24px;
    gap: 16px;
  }
  .section-indicator {
    font-size: 10.5px;
    letter-spacing: 1.5px;
    margin-bottom: 8px;
  }
  .slide-heading {
    font-size: 20px;
    line-height: 1.25;
    margin-bottom: 12px;
  }
  .slide-body {
    font-size: 15.5px;
    line-height: 1.58;
  }
  .slide-body p {
    margin-bottom: 10px;
  }
  .photo-card {
    height: 310px;
    padding: 10px;
    border-radius: 12px;
  }
  .photo-frame {
    height: 210px;
    max-height: 210px;
    border-radius: 8px;
  }
  .photo-badge {
    font-size: 9.5px;
    padding: 3px 8px;
  }
  .photo-slide-num {
    font-size: 11px;
  }
  .photo-caption {
    font-size: 12.5px;
    margin-top: 6px;
  }
  #nav {
    height: 54px;
    padding: 0 10px;
  }
  .nav-btn {
    padding: 6px 12px;
    font-size: 12px;
  }
  .counter-wrap {
    gap: 4px;
  }
  .counter-wrap span:nth-child(2) {
    display: none; /* Hide 'Перейти:' label */
  }
  #counter {
    font-size: 12.5px;
  }
  #jump-input {
    width: 38px;
    padding: 3px 4px;
    font-size: 11px;
  }
  #lightbox-modal {
    padding: 14px;
  }
  #lightbox-img {
    max-width: 96vw;
    max-height: 65vh;
  }
  #lightbox-caption {
    font-size: 15px;
    margin-top: 12px;
  }
  .lightbox-close {
    top: 10px;
    right: 12px;
    padding: 5px 12px;
    font-size: 12px;
  }
}

</style>
</head>
<body>

<div id="ambient-glow"></div>
<div id="progress-bar"></div>

<header id="top-header">
  <div class="header-meta">
    <span class="pill-tag">Литература • 11-А класс</span>
    <span class="author-info">Автор: <strong>Сеит-Велиев Демирель Русланович</strong></span>
  </div>
  <div class="header-controls">
    <button class="action-btn" onclick="toggleToc()">☰ Содержание</button>
    <button class="action-btn" onclick="toggleTheme()">🌓 Тема</button>
    <button class="action-btn" onclick="window.print()">🖨 Печать / PDF</button>
    <button class="action-btn" onclick="toggleFullscreen()">⛶ На весь экран</button>
  </div>
</header>

<main id="app"></main>

<footer id="nav">
  <div class="nav-cluster">
    <button class="nav-btn" onclick="prev()">← Назад</button>
    <button class="nav-btn" onclick="next()">Вперёд →</button>
  </div>

  <div class="counter-wrap">
    <span id="counter">1 / 100</span>
    <span style="color:var(--text-muted); font-size:12px;">Перейти:</span>
    <input type="number" id="jump-input" min="1" max="100" placeholder="№" onchange="jumpTo(this.value)">
  </div>

  <div class="nav-cluster">
    <span style="font-size:12px; color:var(--text-muted);">Клавиши: ← / → / Пробел</span>
  </div>
</footer>

<div id="toc-modal">
  <div class="toc-container">
    <div class="toc-top">
      <h2>Содержание презентации (100 слайдов)</h2>
      <div style="display:flex; gap:14px; align-items:center;">
        <input type="text" class="toc-search" id="toc-search" placeholder="Поиск по темам и авторам..." oninput="filterToc(this.value)">
        <button class="action-btn" onclick="toggleToc()">✕ Закрыть</button>
      </div>
    </div>
    <div class="toc-grid" id="toc-grid"></div>
  </div>
</div>

<script src="slides.js"></script>
<script>
let cur = 0;
const app = document.getElementById('app');

function renderAllSlides() {
  app.innerHTML = '';
  slides.forEach((s, idx) => {
    const slideElem = document.createElement('div');
    slideElem.className = 'slide' + (idx === 0 ? ' active' : '');
    slideElem.id = 'slide-' + idx;

    slideElem.innerHTML = `
      <div class="slide-grid">
        <div class="slide-text-col">
          <div class="section-indicator">${s.section || 'Серебряный век'}</div>
          <h2 class="slide-heading">${s.title}</h2>
          <div class="slide-body">
            ${s.content}
          </div>
          ${s.key_point ? `<div class="key-point-box"><span>✦</span><strong>Главный вывод:</strong> ${s.key_point}</div>` : ''}
        </div>
        <div class="slide-visual-col">
          ${s.visual || ''}
        </div>
      </div>
    `;
    app.appendChild(slideElem);
  });

  buildToc();
  updateUi();
}

function buildToc() {
  const grid = document.getElementById('toc-grid');
  grid.innerHTML = '';
  slides.forEach((s, idx) => {
    const item = document.createElement('div');
    item.className = 'toc-item';
    item.setAttribute('data-search', (s.title + ' ' + (s.section || '')).toLowerCase());
    item.innerHTML = `
      <span class="toc-num">${idx + 1}.</span>
      <span class="toc-title">${s.title}</span>
    `;
    item.onclick = () => {
      goTo(idx);
      toggleToc();
    };
    grid.appendChild(item);
  });
}

function filterToc(query) {
  const q = query.toLowerCase().trim();
  const items = document.querySelectorAll('.toc-item');
  items.forEach(el => {
    const text = el.getAttribute('data-search');
    el.style.display = text.includes(q) ? 'flex' : 'none';
  });
}

function updateUi() {
  document.getElementById('counter').textContent = (cur + 1) + ' / ' + slides.length;
  document.getElementById('progress-bar').style.width = (((cur + 1) / slides.length) * 100) + '%';
  document.getElementById('jump-input').value = cur + 1;
}

function goTo(n) {
  if (n < 0 || n >= slides.length) return;
  const oldSlide = document.querySelector('.slide.active');
  if (oldSlide) oldSlide.classList.remove('active');

  cur = n;
  const newSlide = document.getElementById('slide-' + cur);
  if (newSlide) {
    newSlide.classList.add('active');
    newSlide.scrollTop = 0;
  }

  updateUi();
  return;
}


function next() {
  if (cur < slides.length - 1) goTo(cur + 1);
}

function prev() {
  if (cur > 0) goTo(cur - 1);
}

function jumpTo(val) {
  const num = parseInt(val, 10);
  if (!isNaN(num) && num >= 1 && num <= slides.length) {
    goTo(num - 1);
  }
}

function toggleToc() {
  const modal = document.getElementById('toc-modal');
  modal.classList.toggle('open');
  if (modal.classList.contains('open')) {
    document.getElementById('toc-search').focus();
  }
}

function toggleTheme() {
  document.body.classList.toggle('theme-light');
}


function openLightbox(src, caption) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox-caption').innerHTML = caption;
  document.getElementById('lightbox-modal').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox-modal').classList.remove('open');
}

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(err => console.log(err));
  } else {
    document.exitFullscreen().catch(err => console.log(err));
  }
}

// Keyboard controls
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
    e.preventDefault();
    next();
  } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
    e.preventDefault();
    prev();
  } else if (e.key === 'Home') {
    e.preventDefault();
    goTo(0);
  } else if (e.key === 'End') {
    e.preventDefault();
    goTo(slides.length - 1);
  } else if (e.key === 'Escape') {
    const modal = document.getElementById('toc-modal');
    if (modal.classList.contains('open')) toggleToc();
  } else if (e.key === 'f' || e.key === 'F' || e.key === 'а' || e.key === 'А') {
    toggleFullscreen();
  }
});

// Touch swipe support for mobile/tablets
let touchStartX = 0;
let touchStartY = 0;
document.addEventListener('touchstart', (e) => {
  touchStartX = e.changedTouches[0].screenX;
  touchStartY = e.changedTouches[0].screenY;
}, { passive: true });

document.addEventListener('touchend', (e) => {
  const dx = e.changedTouches[0].screenX - touchStartX;
  const dy = e.changedTouches[0].screenY - touchStartY;
  // Trigger slide transition only on intentional horizontal swipe, not vertical scroll
  if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.5) {
    if (dx < 0) next();
    else prev();
  }
}, { passive: true });

// Initialize
renderAllSlides();
</script>

<div id="lightbox-modal" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">✕ Закрыть</button>
  <img id="lightbox-img" src="" alt="Фотография" onclick="event.stopPropagation()">
  <div id="lightbox-caption" onclick="event.stopPropagation()"></div>
</div>

</body>
</html>
